# Theme: calm indigo accent, serif headings for a legal feel, light and dark variants
# (users switch between them from the app's settings menu).

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 600, 600]
codeFontSize = "0.85rem"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#3B5BDB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FB"
textColor = "#1C2333"
linkColor = "#3B5BDB"
borderColor = "#DDE2EE"
codeBackgroundColor = "#F4F6FB"
blueColor = "#3B5BDB"
greenColor = "#2B8A3E"
orangeColor = "#C2410C"
redColor = "#C92A2A"
violetColor = "#7048E8"
grayColor = "#5C677D"

[theme.light.sidebar]
backgroundColor = "#F7F8FC"
secondaryBackgroundColor = "#ECEFF7"

[theme.dark]
primaryColor = "#5C7CFA"
backgroundColor = "#0F131C"
secondaryBackgroundColor = "#171D2A"
textColor = "#E4E8F1"
linkColor = "#91A7FF"
borderColor = "#2A3346"
codeBackgroundColor = "#171D2A"
blueColor = "#748FFC"
greenColor = "#51CF66"
orangeColor = "#FF922B"
redColor = "#FF6B6B"
violetColor = "#9775FA"
grayColor = "#8D96A8"

[theme.dark.sidebar]
backgroundColor = "#0B0F17"
secondaryBackgroundColor = "#151B27"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
